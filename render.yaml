services:
  - type: web
    name: lunar-shift
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
  - type: web
    name: lunar-shift-backend
    runtime: docker
    plan: free
    branch: main
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: NASA_API_KEY
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
